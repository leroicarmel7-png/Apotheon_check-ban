<script>
window.APOTHEON_REAL_API = '/api/check/';
async function checkBanReal(){
  const input = document.querySelector('input[type="tel"], input[type="text"]') || document.querySelector('input');
  if(!input){ alert('Entre numéro'); return; }
  const phone = input.value;
  const resultDiv = document.getElementById('result') || document.querySelector('[id*="result"]') || document.body;
  resultDiv.innerHTML = '<div style="color:#00e5ff">🪐 Invocation Baron... vérification réelle WhatsApp...</div>';
  try{
    const res = await fetch(window.APOTHEON_REAL_API + encodeURIComponent(phone));
    const data = await res.json();
    console.log('REAL RESULT', data);
    if(data.banned){
      resultDiv.innerHTML = `<div style="background:rgba(255,0,0,0.2);padding:12px;border-radius:8px;border:1px solid #f00"><b>🚫 BANNI - VRAI CHECK</b><br>Numéro: ${data.phone}<br>Heure ban réelle: ${data.banTimeLocal}<br>Type: ${data.violationType}<br>Source: WhatsApp Serveur direct<br><small>isReal:${data.isReal}</small></div>`;
    } else {
      resultDiv.innerHTML = `<div style="background:rgba(0,255,100,0.2);padding:12px;border-radius:8px;border:1px solid #0f0"><b>✅ NON BANNI - VRAI CHECK</b><br>${data.message||'Numéro actif'}<br>Source: WhatsApp Serveur direct</div>`;
    }
  }catch(e){ resultDiv.innerHTML = 'Erreur: '+e.message; }
}
// Override existing button onclick to use real
document.addEventListener('DOMContentLoaded', ()=>{
  const btns = document.querySelectorAll('button');
  btns.forEach(b=>{
    if(b.textContent.toLowerCase().includes('check') || b.textContent.toLowerCase().includes('jug') || b.textContent.toLowerCase().includes('vérif')){
      b.onclick = checkBanReal;
    }
  });
});
</script>
